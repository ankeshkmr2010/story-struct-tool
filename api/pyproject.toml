[project]
name = "storytool-api"
version = "0.1.0"
description = "Structural planning and writing tool for fiction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "litestar[standard]>=2.13",
    "advanced-alchemy>=0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "uuid-utils>=0.10",
    "anthropic>=1.11.0",
    "typesafe-sdk>=0.7.2",
    "google-auth[requests]>=2.60.0",
    "openai>=3.26.0",
    "cryptography>=50.0.2",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "anyio>=4.7",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storytool"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/storytool/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = []
exclude = ["src/storytool/db/migrations"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
# Litestar declares `tags`/`dependencies`/`signature_namespace` as instance variables, so
# annotating them ClassVar (RUF012's advice) is what mypy rejects. mypy wins here.
"**/*controller.py" = ["RUF012"]
