<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/branding/storytool.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/apple-touch-icon.png" />
    <meta name="theme-color" content="#315c4b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Build your fiction from premise to prose. Connect characters, beats, arcs, and timelines in one writing workspace." />
    <title>StoryTool — From idea to story</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('storytool-theme');
        var theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
