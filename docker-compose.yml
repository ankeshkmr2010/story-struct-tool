# Dev dependencies only. The API runs locally via `uv run`; it gets its own Dockerfile
# when we containerise for deploy (Phase 0 tail).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: storytool
      POSTGRES_PASSWORD: storytool
      POSTGRES_DB: storytool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storytool -d storytool"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
